name: Load MLB Market Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern game date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      bookmakers:
        description: "Use 'all' for every available sportsbook, or provide a comma-separated allowlist."
        required: false
        default: "all"
        type: string
  schedule:
    # Multiple refreshes improve player coverage as books post markets during the day.
    # 10:00 AM EDT.
    - cron: "0 14 * * *"

jobs:
  load-mlb-market-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      # Loader configuration
      SPORT_KEY: baseball_mlb
      # Batter hit market configuration
      MARKET_KEY: batter_hits
      ODDS_REGIONS: us
      BOOKMAKERS: ${{ inputs.bookmakers || 'all' }}
      ODDS_TARGET_DATE: ${{ inputs.target_date || '' }}
      MAX_EVENTS_PER_RUN: 20
      SKIP_STARTED_GAMES: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hit-prop-odds.txt

      - name: Verify configuration
        run: |
          echo "Sport: $SPORT_KEY"
          echo "Market: $MARKET_KEY"
          echo "Regions: $ODDS_REGIONS"
          echo "Books: $BOOKMAKERS"
          echo "Target Date: ${ODDS_TARGET_DATE:-today Eastern}"
          echo "Max Events: $MAX_EVENTS_PER_RUN"
          echo "Skip Started Games: $SKIP_STARTED_GAMES"

      - name: Load MLB Hit Prop Market Odds
        id: hit_odds
        continue-on-error: true
        run: python scripts/load_hit_prop_market_odds.py

      - name: Load MLB Pitcher Strikeout Market Odds
        id: pitcher_k_odds
        continue-on-error: true
        run: python scripts/load_pitcher_k_market_odds.py

      - name: Validate market odds loaders
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          hit_outcome="${{ steps.hit_odds.outcome }}"
          pitcher_k_outcome="${{ steps.pitcher_k_odds.outcome }}"

          echo "Hit odds loader outcome: ${hit_outcome}"
          echo "Pitcher K odds loader outcome: ${pitcher_k_outcome}"

          {
            echo "## MLB Market Odds Loader Status"
            echo ""
            echo "| Loader | Outcome |"
            echo "|---|---|"
            echo "| Batter Hits | ${hit_outcome} |"
            echo "| Pitcher Strikeouts | ${pitcher_k_outcome} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${hit_outcome}" != "success" || "${pitcher_k_outcome}" != "success" ]]; then
            echo "One or more market odds loaders failed."
            exit 1
          fi

      - name: Upload loader log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-market-odds-loader-log-${{ github.run_id }}
          path: |
            *.log
            logs/**
          if-no-files-found: ignore
