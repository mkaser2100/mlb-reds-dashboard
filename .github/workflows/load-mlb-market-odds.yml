name: Load MLB Market Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern game date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      bookmakers:
        description: "Use 'all' for every available sportsbook, or provide a comma-separated allowlist."
        required: false
        default: "all"
        type: string

# schedule:
#   # Daily pregame refresh. The loader skips games that already started.
#   - cron: "0 14 * * *"

jobs:
  load-mlb-market-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      SPORT_KEY: baseball_mlb
      ODDS_MARKET_KEYS: batter_hits,batter_total_bases,batter_home_runs
      ODDS_REGIONS: us
      BOOKMAKERS: ${{ inputs.bookmakers || 'all' }}
      ODDS_TARGET_DATE: ${{ inputs.target_date || '' }}
      MAX_EVENTS_PER_RUN: 20
      SKIP_STARTED_GAMES: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hit-prop-odds.txt

      - name: Verify configuration
        run: |
          echo "Sport: $SPORT_KEY"
          echo "Batter markets: $ODDS_MARKET_KEYS"
          echo "Regions: $ODDS_REGIONS"
          echo "Books: $BOOKMAKERS"
          echo "Target Date: ${ODDS_TARGET_DATE:-today Eastern}"
          echo "Max Events: $MAX_EVENTS_PER_RUN"
          echo "Skip Started Games: $SKIP_STARTED_GAMES"

      - name: Load MLB Batter Prop Market Odds
        id: batter_prop_odds
        continue-on-error: true
        run: python scripts/load_hit_prop_market_odds.py

      - name: Load MLB Pitcher Strikeout Market Odds
        id: pitcher_k_odds
        continue-on-error: true
        run: python scripts/load_pitcher_k_market_odds.py

      - name: Validate market odds loaders
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          batter_outcome="${{ steps.batter_prop_odds.outcome }}"
          pitcher_k_outcome="${{ steps.pitcher_k_odds.outcome }}"

          echo "Batter prop odds loader outcome: ${batter_outcome}"
          echo "Pitcher K odds loader outcome: ${pitcher_k_outcome}"

          {
            echo "## MLB Market Odds Loader Status"
            echo ""
            echo "| Loader | Outcome |"
            echo "|---|---|"
            echo "| Batter Hits / 2+ TB / Home Run | ${batter_outcome} |"
            echo "| Pitcher Strikeouts | ${pitcher_k_outcome} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${batter_outcome}" != "success" || "${pitcher_k_outcome}" != "success" ]]; then
            echo "One or more market odds loaders failed."
            exit 1
          fi

      - name: Upload loader log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-market-odds-loader-log-${{ github.run_id }}
          path: |
            *.log
            logs/**
          if-no-files-found: ignore
