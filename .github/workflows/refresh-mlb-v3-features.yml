name: Refresh MLB V3 Features

on:
  workflow_dispatch:
    inputs:
      game_date:
        description: "Prediction date to refresh in YYYY-MM-DD. Blank defaults to today ET."
        required: false
        type: string

  workflow_run:
    workflows: ["Load MLB Statcast"]
    types: [completed]

  schedule:
    # Backup run after the scheduled Statcast load.
    # 12:15 UTC = 8:15 AM EDT / 7:15 AM EST.
    - cron: "15 12 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: refresh-mlb-v3-features
  cancel-in-progress: false

jobs:
  once-daily-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}

    steps:
      - name: Enforce one automatic run per Eastern day
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const automaticEvents = new Set(["schedule", "workflow_run"]);

            // Manual runs remain available for intentional same-day reruns.
            if (!automaticEvents.has(context.eventName)) {
              core.info(`Event ${context.eventName} is not automatic; allowing run.`);
              core.setOutput("should_run", "true");
              return;
            }

            const easternDate = (value) => {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).formatToParts(new Date(value));

              const values = Object.fromEntries(
                parts
                  .filter((part) => part.type !== "literal")
                  .map((part) => [part.type, part.value])
              );

              return `${values.year}-${values.month}-${values.day}`;
            };

            const todayEastern = easternDate(new Date());
            const workflowPrefix = `${context.repo.owner}/${context.repo.repo}/`;
            const workflowId = process.env.GITHUB_WORKFLOW_REF
              .split("@")[0]
              .replace(workflowPrefix, "");

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                per_page: 100,
              }
            );

            const priorSuccessfulAutomaticRun = runs.find((run) => {
              if (run.id === context.runId) return false;
              if (!automaticEvents.has(run.event)) return false;
              if (run.conclusion !== "success") return false;
              return easternDate(run.created_at) === todayEastern;
            });

            if (priorSuccessfulAutomaticRun) {
              core.info(
                `Skipping duplicate automatic feature refresh. Prior successful run ` +
                `${priorSuccessfulAutomaticRun.id} was created at ` +
                `${priorSuccessfulAutomaticRun.created_at}.`
              );
              core.setOutput("should_run", "false");
              return;
            }

            core.info("No prior successful automatic feature refresh found today.");
            core.setOutput("should_run", "true");

  refresh-features:
    needs: once-daily-gate
    if: ${{ needs.once-daily-gate.outputs.should_run == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 22

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install refresh dependency
        run: python -m pip install --upgrade pip requests

      - name: Refresh V3 enhancement features
        shell: bash
        env:
          INPUT_GAME_DATE: ${{ inputs.game_date }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_GAME_DATE:-}" ]]; then
            python scripts/refresh_mlb_v3_features.py --game-date "$INPUT_GAME_DATE"
          else
            python scripts/refresh_mlb_v3_features.py
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## MLB V3 Feature Refresh"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Game date: \`${{ inputs.game_date || 'today ET' }}\`"
            echo "- Automatic duplicate guard: \`enabled\`"
            echo "- Concurrency guard: \`enabled\`"
            echo "- Existing-complete check: \`enabled\`"
            echo "- PostgreSQL 55P03 handling: \`re-check + one retry after 60s\`"
            echo "- Ambiguous 504/network handling: \`poll mlb_ml_feature_refresh_runs\`"
            echo "- Poll timeout: \`15 minutes\`"
            echo "- Job timeout: \`22 minutes\`"
          } >> "$GITHUB_STEP_SUMMARY"
