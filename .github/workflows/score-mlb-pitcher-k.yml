name: Score MLB Pitcher K

on:
  workflow_call:
    inputs:
      game_date:
        required: false
        type: string
      allow_after_start:
        required: false
        default: false
        type: boolean
      prediction_stage:
        required: false
        default: preliminary
        type: string
      confirmed_only:
        required: false
        default: false
        type: boolean
      skip_started:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      game_date:
        description: "YYYY-MM-DD; blank = today ET"
        required: false
        type: string
      allow_after_start:
        description: "Recovery only: allow scoring after games have started"
        required: false
        default: false
        type: boolean
      prediction_stage:
        description: "preliminary or final"
        required: false
        default: preliminary
        type: choice
        options:
          - preliminary
          - final
      confirmed_only:
        description: "Only score rows backed by confirmed lineups"
        required: false
        default: false
        type: boolean
      skip_started:
        description: "Skip games already underway instead of failing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: score-mlb-pitcher-k-${{ inputs.game_date || 'today' }}-${{ inputs.prediction_stage || 'preliminary' }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "scipy>=1.13,<2"

      - name: Score pitcher K distributions
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--prediction-stage "${{ inputs.prediction_stage || 'preliminary' }}")
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          if [[ "${{ inputs.allow_after_start }}" == "true" ]]; then
            ARGS+=(--allow-after-start)
          fi
          if [[ "${{ inputs.confirmed_only }}" == "true" ]]; then
            ARGS+=(--confirmed-only)
          fi
          if [[ "${{ inputs.skip_started }}" == "true" ]]; then
            ARGS+=(--skip-started)
          fi
          python scripts/score_pitcher_k.py "${ARGS[@]}"

      - name: Validate preliminary shadow pipeline health
        if: ${{ (inputs.prediction_stage || 'preliminary') == 'preliminary' }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--min-coverage-pct 95)
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          if [[ "${{ inputs.allow_after_start }}" == "true" ]]; then
            ARGS+=(--allow-after-start)
          fi
          python scripts/validate_pitcher_k_shadow.py "${ARGS[@]}"

      - name: Job summary
        if: always()
        run: |
          echo "## Pitcher K Scoring" >> "$GITHUB_STEP_SUMMARY"
          echo "Stage: ${{ inputs.prediction_stage || 'preliminary' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preliminary runs keep the existing shadow-health validation. Final runs are confirmed-lineup refreshes." >> "$GITHUB_STEP_SUMMARY"
