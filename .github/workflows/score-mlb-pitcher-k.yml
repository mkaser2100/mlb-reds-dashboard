name: Score MLB Pitcher K

on:
  workflow_call:
    inputs:
      game_date:
        required: false
        type: string
      allow_after_start:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      game_date:
        description: "YYYY-MM-DD; blank = today ET"
        required: false
        type: string
      allow_after_start:
        description: "Recovery only: allow scoring after games have started"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: score-mlb-pitcher-k-${{ inputs.game_date || 'today' }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scoring dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "scipy>=1.13,<2"

      - name: Score pitcher K distributions
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "${{ inputs.game_date }}" ]]; then
            ARGS+=(--date "${{ inputs.game_date }}")
          fi
          if [[ "${{ inputs.allow_after_start }}" == "true" ]]; then
            ARGS+=(--allow-after-start)
          fi
          python scripts/score_pitcher_k.py "${ARGS[@]}"
