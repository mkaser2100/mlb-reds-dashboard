name: MLB Power Models - Daily Shadow Score

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional game date (YYYY-MM-DD). Blank = today in America/New_York"
        required: false
        type: string
      target:
        description: "Target to score"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - home_run_1plus
          - total_bases_2plus
      dry_run:
        description: "Score without writing predictions"
        required: true
        default: false
        type: boolean
      allow_after_start:
        description: "Recovery only: allow scoring after today's games have started"
        required: true
        default: false
        type: boolean

  # Backup scheduled run only. Primary freshness protection is the
  # cache refresh step that runs immediately after successful scoring.
  schedule:
    - cron: "15 12 * * *"

concurrency:
  group: mlb-power-model-daily-${{ github.event.inputs.run_date || 'today' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  score-power-models:
    name: Score HR + Total Bases shadow models
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Supabase client
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Compile scorer
        run: python -m py_compile scripts/score_mlb_power_models.py

      - name: Refresh and validate Phase 1 power features
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          requested = "${{ github.event.inputs.run_date || '' }}".strip()
          run_date = requested or datetime.now(
              ZoneInfo("America/New_York")
          ).date().isoformat()

          print(f"Refreshing Phase 1 power features for {run_date}...")

          refresh = supabase.rpc(
              "refresh_mlb_ml_batter_power_features",
              {"p_game_date": run_date},
          ).execute()

          print("Power feature refresh result:")
          print(refresh.data)

          validation = (
              supabase.table("mlb_ml_batter_power_features_daily")
              .select(
                  "player_id,environment_point_in_time_safe",
                  count="exact",
              )
              .eq("game_date", run_date)
              .limit(1000)
              .execute()
          )

          rows = validation.data or []
          row_count = (
              validation.count
              if validation.count is not None
              else len(rows)
          )

          if row_count <= 0:
              raise RuntimeError(
                  f"Power feature refresh produced no rows for {run_date}"
              )

          unsafe_rows = sum(
              1
              for row in rows
              if row.get("environment_point_in_time_safe") is not True
          )

          print(
              f"Phase 1 power features ready for {run_date}: "
              f"{row_count} rows"
          )

          if unsafe_rows:
              raise RuntimeError(
                  f"Power feature validation found {unsafe_rows} rows "
                  f"without point-in-time-safe environment data for {run_date}"
              )

          print(
              f"Point-in-time environment validation passed for "
              f"{len(rows)} sampled/returned rows."
          )
          PY

      - name: Score shadow models
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()

          if [[ -n "${{ github.event.inputs.run_date || '' }}" ]]; then
            ARGS+=(--date "${{ github.event.inputs.run_date }}")
          fi

          ARGS+=(--target "${{ github.event.inputs.target || 'all' }}")

          if [[ "${{ github.event.inputs.dry_run || 'false' }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          if [[ "${{ github.event.inputs.allow_after_start || 'false' }}" == "true" ]]; then
            ARGS+=(--allow-after-start)
          fi

          python scripts/score_mlb_power_models.py "${ARGS[@]}"

      - name: Refresh batter prediction board cache
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          run_date = "${{ github.event.inputs.run_date || '' }}".strip()
          params = {"p_run_date": run_date} if run_date else {}

          result = supabase.rpc(
              "refresh_mlb_batter_prediction_board_cache",
              params,
          ).execute()

          print("Batter prediction board cache refresh result:")
          print(result.data)

          if not result.data:
              raise RuntimeError(
                  "refresh_mlb_batter_prediction_board_cache returned no result"
              )
          PY

      - name: Validate HR and Total Bases cache freshness
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from supabase import create_client

          supabase = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          )

          requested = "${{ github.event.inputs.run_date || '' }}".strip()
          run_date = requested or datetime.now(ZoneInfo("America/New_York")).date().isoformat()

          response = (
              supabase.table("mlb_batter_prediction_board_cache")
              .select("target_name,prediction_run_date,player_id")
              .eq("prediction_run_date", run_date)
              .in_("target_name", ["home_run_1plus", "total_bases_2plus"])
              .execute()
          )

          rows = response.data or []
          counts = {
              "home_run_1plus": 0,
              "total_bases_2plus": 0,
          }
          for row in rows:
              target = row.get("target_name")
              if target in counts:
                  counts[target] += 1

          print(f"Cache validation for {run_date}: {counts}")

          missing = [target for target, count in counts.items() if count == 0]
          if missing:
              raise RuntimeError(
                  f"Cache freshness validation failed for {run_date}; missing targets: {missing}"
              )
          PY
