name: Apply V3 Green Cleanup

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch to clean up"
        required: true
        default: "main"
        type: string
      branch_name:
        description: "Optional output branch. Leave blank to create a unique cleanup branch."
        required: false
        default: ""
        type: string
      create_pull_request:
        description: "Create a pull request after validation"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v3-green-cleanup
  cancel-in-progress: false

jobs:
  apply-green-cleanup:
    runs-on: ubuntu-latest

    env:
      BASE_BRANCH: ${{ inputs.base_branch }}
      REQUESTED_BRANCH: ${{ inputs.branch_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve cleanup branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_BRANCH}" ]]; then
            BRANCH="${REQUESTED_BRANCH}"
          else
            BRANCH="cleanup/v3-green-items-${GITHUB_RUN_ID}"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Using cleanup branch: ${BRANCH}"

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          test -f app-v4.js
          test -f index.html
          test -f apply_green_cleanup.py

          echo "Required files are present."

      - name: Create cleanup branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${BASE_BRANCH}"
          git checkout -B "${{ steps.branch.outputs.branch }}" "origin/${BASE_BRANCH}"

      - name: Apply approved green cleanup
        id: cleanup
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fq 'const MLB_BOARD_MODE = "ml";' app-v4.js              && ! grep -Fq 'id="modelCompareView"' index.html              && ! grep -Fq 'viewName === "compare"' app-v4.js              && ! grep -Fq 'activeView === "modelCompareView"' app-v4.js; then
            echo "The approved green cleanup already appears to be applied."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python apply_green_cleanup.py

          # The cleanup script intentionally creates local backups.
          # They are useful locally but should not be committed.
          rm -f app-v4.js.bak index.html.bak

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app-v4.js

      - name: Validate cleanup contract
        shell: bash
        run: |
          set -euo pipefail

          # Removed green items must be absent.
          ! grep -Fq 'const MLB_BOARD_MODE = "ml";' app-v4.js
          ! grep -Fq 'const modelCompareView = $("modelCompareView");' app-v4.js
          ! grep -Fq 'viewName === "compare"' app-v4.js
          ! grep -Fq 'activeView === "modelCompareView"' app-v4.js
          ! grep -Fq 'id="modelCompareView"' index.html

          # Protected production dependencies must remain.
          grep -Fq 'loadV2Enhancements' app-v4.js
          grep -Fq 'mergeV2Enhancements' app-v4.js
          grep -Fq 'withV2Enhancement' app-v4.js
          grep -Fq 'loadV3DrawerExplanations' app-v4.js
          grep -Fq '"v_mlb_v3_hit_board_cache"' app-v4.js
          grep -Fq '"v_mlb_v3_reds_game_hit_board_cache"' app-v4.js
          grep -Fq '"v_mlb_hit_over05_market_edge_health"' app-v4.js
          grep -Fq 'const PERFORMANCE_MODEL_FILTERS = ["All", "V1", "V2", "V3"];' app-v4.js

          echo "Cleanup contract validation passed."

      - name: Show resulting diff
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app-v4.js index.html

      - name: Commit and push cleanup branch
        if: steps.cleanup.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app-v4.js index.html
          git commit -m "Remove unreachable green cleanup items"
          git push --set-upstream origin "${{ steps.branch.outputs.branch }}"

      - name: Create pull request
        if: steps.cleanup.outputs.changed == 'true' && inputs.create_pull_request
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ steps.branch.outputs.branch }}"

          EXISTING_URL="$(
            gh pr list               --repo "${GITHUB_REPOSITORY}"               --head "${BRANCH}"               --base "${BASE_BRANCH}"               --state open               --json url               --jq '.[0].url // empty'
          )"

          if [[ -n "${EXISTING_URL}" ]]; then
            echo "Pull request already exists: ${EXISTING_URL}"
            exit 0
          fi

          gh pr create             --repo "${GITHUB_REPOSITORY}"             --base "${BASE_BRANCH}"             --head "${BRANCH}"             --title "Remove unreachable green cleanup items"             --body "## Summary

          Applies the approved low-risk cleanup only:

          - removes the unused MLB_BOARD_MODE constant
          - removes the empty performance-scope wiring function
          - disconnects the unreachable compare route
          - removes the empty modelCompareView HTML container

          ## Validation

          - node --check app-v4.js
          - protected V2/V3 data contracts remain
          - V1/V2/V3 Model Performance selector remains
          - no CSS or compare implementation functions were deleted"
