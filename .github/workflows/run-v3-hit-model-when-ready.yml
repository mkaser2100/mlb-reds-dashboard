name: Run V3 Hit Model When Ready

on:
  workflow_run:
    workflows:
      - "Load V3 Hit Actuals"
      - "Refresh MLB V3 Features"
    types: [completed]
  schedule:
    # Backup readiness check at 12:45 UTC / 8:45 AM EDT.
    - cron: "45 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: run-v3-hit-model-readiness
  cancel-in-progress: false

jobs:
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Confirm both V3 prerequisites succeeded today
        id: ready
        uses: actions/github-script@v7
        with:
          script: |
            const easternDate = (value) => {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).formatToParts(new Date(value));
              const values = Object.fromEntries(
                parts.filter(p => p.type !== "literal").map(p => [p.type, p.value])
              );
              return `${values.year}-${values.month}-${values.day}`;
            };

            const today = easternDate(new Date());
            const required = [
              "Load V3 Hit Actuals",
              "Refresh MLB V3 Features",
            ];

            for (const workflowName of required) {
              const workflows = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });

              const workflow = workflows.data.workflows.find(
                w => w.name === workflowName
              );

              if (!workflow) {
                core.warning(`Workflow not found: ${workflowName}`);
                core.setOutput("ready", "false");
                return;
              }

              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                per_page: 100,
              });

              const successToday = runs.data.workflow_runs.find(run =>
                run.conclusion === "success" &&
                easternDate(run.created_at) === today
              );

              if (!successToday) {
                core.info(`${workflowName} has not succeeded today.`);
                core.setOutput("ready", "false");
                return;
              }

              core.info(
                `${workflowName} succeeded today in run ${successToday.id}.`
              );
            }

            core.setOutput("ready", "true");

  dispatch-v3-model:
    needs: check-prerequisites
    if: ${{ needs.check-prerequisites.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Run V3 Hit Model
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const workflow = workflows.data.workflows.find(
              w => w.name === "Run V3 Hit Model"
            );

            if (!workflow) {
              core.setFailed("Run V3 Hit Model workflow not found.");
              return;
            }

            // Avoid duplicate automatic dispatches if V3 already succeeded today.
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.id,
              per_page: 100,
            });

            const easternDate = (value) => {
              const parts = new Intl.DateTimeFormat("en-US", {
                timeZone: "America/New_York",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
              }).formatToParts(new Date(value));
              const values = Object.fromEntries(
                parts.filter(p => p.type !== "literal").map(p => [p.type, p.value])
              );
              return `${values.year}-${values.month}-${values.day}`;
            };

            const today = easternDate(new Date());
            const successToday = runs.data.workflow_runs.find(run =>
              run.conclusion === "success" &&
              easternDate(run.created_at) === today
            );

            if (successToday) {
              core.info(
                `Run V3 Hit Model already succeeded today in run ${successToday.id}; skipping.`
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow.id,
              ref: context.payload.repository.default_branch,
            });

            core.info("Dispatched Run V3 Hit Model.");
