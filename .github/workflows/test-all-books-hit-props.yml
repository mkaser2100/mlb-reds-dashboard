name: Test All Books MLB Hit Props

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      max_events:
        description: "Maximum number of MLB games to test."
        required: false
        default: "3"
        type: string
      regions:
        description: "Odds API regions to request."
        required: false
        default: "us,uk"
        type: string
      markets:
        description: "Comma-separated markets to test."
        required: false
        default: "batter_hits,batter_hits_alternate"
        type: string

jobs:
  test-all-books-hit-props:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      TEST_TARGET_DATE: ${{ inputs.target_date }}
      TEST_MAX_EVENTS: ${{ inputs.max_events }}
      TEST_REGIONS: ${{ inputs.regions }}
      TEST_MARKETS: ${{ inputs.markets }}
      TEST_SPORT_KEY: baseball_mlb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify diagnostic files and configuration
        run: |
          echo "Target date: ${TEST_TARGET_DATE:-today}"
          echo "Maximum events: $TEST_MAX_EVENTS"
          echo "Regions: $TEST_REGIONS"
          echo "Markets: $TEST_MARKETS"

          test -n "$THE_ODDS_API_KEY" || {
            echo "THE_ODDS_API_KEY secret is missing."
            exit 1
          }

          test -f scripts/test_all_books_hit_props.py || {
            echo "Missing scripts/test_all_books_hit_props.py"
            exit 1
          }

      - name: Run all-book hit-prop diagnostic
        run: |
          python scripts/test_all_books_hit_props.py

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-books-hit-prop-test-results
          path: all_books_hit_prop_test_output.json
          if-no-files-found: warn
          retention-days: 7
