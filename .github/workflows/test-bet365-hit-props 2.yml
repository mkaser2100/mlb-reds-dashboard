name: Test Bet365 1+ Hit Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern date in YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      max_events:
        description: "Maximum number of upcoming MLB games to test."
        required: false
        default: "3"
        type: string
      regions:
        description: "Odds API regions to request."
        required: false
        default: "us,uk"
        type: string

jobs:
  test-bet365-hit-props:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      TEST_TARGET_DATE: ${{ inputs.target_date }}
      TEST_MAX_EVENTS: ${{ inputs.max_events }}
      TEST_REGIONS: ${{ inputs.regions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify test configuration
        run: |
          echo "Target date: ${TEST_TARGET_DATE:-today}"
          echo "Maximum events: $TEST_MAX_EVENTS"
          echo "Regions: $TEST_REGIONS"
          test -n "$THE_ODDS_API_KEY" || {
            echo "THE_ODDS_API_KEY secret is missing."
            exit 1
          }

      - name: Run Bet365 1+ hits diagnostic
        run: |
          python scripts/test_bet365_1plus_hits.py

      - name: Upload Bet365 diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bet365-hit-prop-test-results
          path: bet365_hit_prop_test_output.json
          if-no-files-found: warn
          retention-days: 7
