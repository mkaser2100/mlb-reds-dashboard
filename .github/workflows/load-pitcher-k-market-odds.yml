name: Load Pitcher K Market Odds

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional Eastern game date YYYY-MM-DD. Defaults to today."
        required: false
        type: string
      bookmakers:
        description: "Use 'all' for every available sportsbook, or a comma-separated allowlist."
        required: false
        default: "all"
        type: string
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: read

concurrency:
  group: load-pitcher-k-market-odds-${{ inputs.target_date || 'today' }}
  cancel-in-progress: false

jobs:
  load-pitcher-k-market-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      ODDS_REGIONS: us
      BOOKMAKERS: ${{ inputs.bookmakers || 'all' }}
      ODDS_TARGET_DATE: ${{ inputs.target_date || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-hit-prop-odds.txt
      - name: Load Pitcher K Market Odds
        run: python scripts/load_pitcher_k_market_odds.py
      - name: Market layer summary
        if: always()
        run: |
          echo "## Pitcher K Phase 5A/5B" >> "$GITHUB_STEP_SUMMARY"
          echo "Loads paired sportsbook Over/Under strikeout props." >> "$GITHUB_STEP_SUMMARY"
          echo "Supabase computes no-vig probabilities, model edge, EV, and best available side/price." >> "$GITHUB_STEP_SUMMARY"
